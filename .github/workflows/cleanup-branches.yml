name: Cleanup old branches

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          
          echo "Fetching branch list via API..."
          
          # Get all branches except main
          BRANCHES=$(gh api repos/${{ github.repository }}/branches --paginate --jq '.[].name' | grep -v '^main$')
          
          # Get branches with open PRs
          PR_BRANCHES=$(gh pr list --repo ${{ github.repository }} --state open --json headRefName --jq '.[].headRefName')
          
          echo "Protected (open PR): $PR_BRANCHES"
          echo "---"
          
          DELETED=0
          SKIPPED=0
          
          for BRANCH in $BRANCHES; do
            # Skip if branch has open PR
            if echo "$PR_BRANCHES" | grep -qx "$BRANCH"; then
              echo "SKIP (open PR): $BRANCH"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            
            # Get last commit date via API (ISO 8601 format)
            COMMIT_DATE=$(gh api "repos/${{ github.repository }}/commits?sha=$BRANCH&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || echo "")
            
            if [ -z "$COMMIT_DATE" ]; then
              echo "SKIP (no date): $BRANCH"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            
            # Parse ISO 8601 date and calculate age
            COMMIT_EPOCH=$(date -d "$COMMIT_DATE" +%s 2>/dev/null || date -d "${COMMIT_DATE%%T*}" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date +%s)
            
            if [ "$COMMIT_EPOCH" -eq 0 ]; then
              echo "SKIP (bad date '$COMMIT_DATE'): $BRANCH"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            
            AGE_DAYS=$(( (NOW_EPOCH - COMMIT_EPOCH) / 86400 ))
            
            if [ "$AGE_DAYS" -lt 3 ]; then
              echo "SKIP (${AGE_DAYS}d old): $BRANCH"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            
            echo "DELETE: $BRANCH (${AGE_DAYS}d old)"
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" 2>/dev/null; then
              DELETED=$((DELETED + 1))
            else
              echo "  Failed: $BRANCH"
            fi
          done
          
          echo ""
          echo "Done. Deleted: $DELETED, Skipped: $SKIPPED"
