name: Auto-merge Claude PRs

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.user.login == 'Phailipp'
    runs-on: ubuntu-latest
    steps:
      - name: Merge Claude PR automatically
        run: |
          echo "Auto-merging Claude PR #${{ github.event.pull_request.number }}"
          gh pr merge ${{ github.event.pull_request.number }} --merge --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
