<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Navy circle background -->
  <circle cx="50" cy="50" r="50" fill="#0d1b2e"/>

  <!-- Mast -->
  <line x1="44" y1="20" x2="44" y2="57" stroke="#c9a962" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Main sail triangle: mast-top → boom-end → mast-base -->
  <polygon points="44,22 44,55 68,55" fill="#c9a962"/>
  <!-- Hull ellipse -->
  <ellipse cx="50" cy="57.5" rx="18" ry="3.5" fill="#c9a962"/>
  <!-- Boom/deck line (dark separator) -->
  <line x1="44" y1="55" x2="68" y2="55" stroke="#0d1b2e" stroke-width="1.2"/>

  <!-- Waterline -->
  <line x1="20" y1="61" x2="80" y2="61" stroke="#c9a962" stroke-width="1.2" opacity="0.65"/>

  <!-- Water reflection wavy lines -->
  <path d="M34,65 Q38,63 42,65 Q46,67 50,65 Q54,63 58,65 Q62,67 66,65" fill="none" stroke="#c9a962" stroke-width="1.4" opacity="0.55"/>
  <path d="M38,70 Q42,68 46,70 Q50,72 54,70 Q58,68 62,70" fill="none" stroke="#c9a962" stroke-width="1.1" opacity="0.38"/>
  <path d="M41,75 Q45,73 49,75 Q53,77 57,75" fill="none" stroke="#c9a962" stroke-width="0.9" opacity="0.22"/>
  <path d="M44,80 Q47,78.5 50,80 Q53,81.5 56,80" fill="none" stroke="#c9a962" stroke-width="0.7" opacity="0.12"/>
</svg>
